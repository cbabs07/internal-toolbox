name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject token and build
        run: |
          mkdir -p dist
          sed "s|%%TOOLBOX_TOKEN%%|${{ secrets.TOOLBOX_TOKEN }}|g" index.html > dist/index.html
          cp toolbox-data.json dist/toolbox-data.json

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd dist
          git init
          git add .
          git commit -m "Deploy toolbox"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
