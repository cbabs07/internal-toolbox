name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Inject token and build
        run: |
          mkdir -p dist
          sed "s|%%TOOLBOX_TOKEN%%|${{ secrets.TOOLBOX_TOKEN }}|g" index.html > dist/index.html
          cp toolbox-data.json dist/toolbox-data.json

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github-actions[bot]:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Check if gh-pages branch exists remotely
          if git ls-remote --exit-code --heads origin gh-pages; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          # Copy built files
          cp dist/index.html ./index.html
          cp dist/toolbox-data.json ./toolbox-data.json

          git add index.html toolbox-data.json
          git commit -m "Deploy toolbox — $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push origin gh-pages
