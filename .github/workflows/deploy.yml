name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject token and build
        run: |
          mkdir -p dist
          sed "s|%%TOOLBOX_TOKEN%%|${{ secrets.TOOLBOX_TOKEN }}|g" index.html > dist/index.html

      - name: Fetch live data file (preserve runtime data)
        run: |
          HTTP_STATUS=$(curl -s -o dist/toolbox-data.json -w "%{http_code}" \
            "https://cbabs07.github.io/internal-toolbox/toolbox-data.json")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Live data not found (status $HTTP_STATUS), using repo copy"
            cp toolbox-data.json dist/toolbox-data.json
          else
            echo "Live data fetched successfully"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
